name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot editor
        run: |
          curl -L --fail --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${{ env.GODOT_VERSION }}" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Install matching Android export templates
        run: |
          curl -L --fail --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${{ env.GODOT_VERSION }}" -o templates.tpz
          mapfile -t android_templates < <(unzip -Z1 templates.tpz | grep -E '^templates/(android_debug\.apk|android_release\.apk|android_source\.zip)$')
          test "${#android_templates[@]}" -eq 3
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          unzip -q templates.tpz "${android_templates[@]}" -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/"

      - name: Configure Android SDK paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and parse project
        run: |
          "$GODOT_BIN" --headless --editor --path . --quit

      - name: Run headless scene smoke test
        run: "$GODOT_BIN" --headless --path . --script res://tests/smoke_test.gd

      - name: Export Android debug APK
        run: |
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/TacticalStrike-debug.apk
          test -s build/TacticalStrike-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: TacticalStrike-Android-debug
          path: build/TacticalStrike-debug.apk
          if-no-files-found: error
          retention-days: 14
