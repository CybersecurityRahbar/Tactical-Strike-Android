name: Godot Reference Build (legacy)

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "tests/**"
      - "tools/prepare_external_assets.sh"
      - "assets/icon.svg"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare licensed weapon, terrain and recorded audio assets
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bash tools/prepare_external_assets.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Download Godot editor
        run: |
          curl -L --fail --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${{ env.GODOT_VERSION }}" -o godot.zip
          unzip -q godot.zip
          chmod +x "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64"
          echo "GODOT_BIN=$PWD/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Cache Godot Android export templates
        id: godot-template-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: ${{ runner.os }}-godot-${{ env.GODOT_VERSION }}-android-templates-v1

      - name: Install matching Android export templates
        if: steps.godot-template-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3 "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${{ env.GODOT_VERSION }}" -o templates.tpz
          mapfile -t android_templates < <(unzip -Z1 templates.tpz | grep -E '^templates/(android_debug\\.apk|android_release\\.apk|android_source\\.zip)$')
          test "${#android_templates[@]}" -eq 3
          mkdir -p "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          unzip -q templates.tpz "${android_templates[@]}" -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/"

      - name: Configure Android SDK paths for Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import and parse Godot reference project
        run: "$GODOT_BIN" --headless --editor --path . --quit

      - name: Run Godot headless scene smoke test
        run: "$GODOT_BIN" --headless --path . --script res://tests/smoke_test.gd

      - name: Export Godot Android reference APK
        run: |
          mkdir -p build/godot-reference
          "$GODOT_BIN" --headless --path . --export-debug "Android" build/godot-reference/TacticalStrike-Godot-reference.apk
          test -s build/godot-reference/TacticalStrike-Godot-reference.apk
          unzip -t build/godot-reference/TacticalStrike-Godot-reference.apk >/dev/null
